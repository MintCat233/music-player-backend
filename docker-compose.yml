services:
  ncm-api:
    build: .
    image: ${APP_IMAGE:-ghcr.io/mintcat233/api-enhanced:latest}
    container_name: api-enhanced-ncm-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-true}
    ports:
      - '3500:3000'

  custom-backend:
    build: .
    image: ${APP_IMAGE:-ghcr.io/mintcat233/api-enhanced:latest}
    container_name: api-enhanced-custom-backend
    restart: unless-stopped
    depends_on:
      - ncm-api
    env_file:
      - .env
    environment:
      APP_BACKEND_HOST: 0.0.0.0
      APP_BACKEND_PORT: 4000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    command: ['/sbin/tini', '--', 'node', 'custom-backend/index.js']
    ports:
      - '3510:4000'

  together-ws:
    build: .
    image: ${APP_IMAGE:-ghcr.io/mintcat233/api-enhanced:latest}
    container_name: api-enhanced-together-ws
    restart: unless-stopped
    depends_on:
      - custom-backend
    env_file:
      - .env
    environment:
      APP_WS_HOST: 0.0.0.0
      APP_WS_PORT: 4100
    command: ['/sbin/tini', '--', 'node', 'custom-backend/ws-server.js']
    ports:
      - '3520:4100'
